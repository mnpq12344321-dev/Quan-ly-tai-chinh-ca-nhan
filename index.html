<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12213f"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sổ Mèo">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#12213f;--gold:#ffb21e;--bg:#eef1f6;--mu:#6b7794;--ok:#0f9d78;--no:#e5484d;--line:#e2e7f0;--bo:12px;--cd:#fff;--tx:#12213f}
[data-th=dark]{--bg:#0b1220;--cd:#16213a;--tx:#e8ecf6;--mu:#93a0bf;--line:#243252;--ink:#1a2a4d}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
/* Đăng nhập */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;background:radial-gradient(ellipse at 50% 0,rgba(255,178,30,.28),transparent 55%),var(--ink)}
.logo img{width:100%;height:100%;object-fit:cover}
.logo{overflow:hidden;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:50px;background:var(--gold);box-shadow:0 0 0 10px rgba(255,178,30,.18)}
#login h1{margin:22px 0 6px;font-size:28px;font-weight:800;letter-spacing:-.5px}
#lm{opacity:.75;font-size:14px;min-height:20px;margin-bottom:26px;text-align:center}
.dots{display:flex;gap:16px;margin-bottom:30px}.dots i{font-style:normal;font-size:24px;opacity:.3;transition:.15s}.dots i.on{opacity:1;transform:scale(1.2)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.pad button{height:74px;border-radius:50%;font-size:26px;font-weight:600;border:1.5px solid rgba(255,255,255,.22)}.pad button:active{background:var(--gold);color:var(--ink)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* App */
#app{max-width:480px;margin:auto;padding-bottom:170px}
.hero{background:radial-gradient(circle at 88% 0,rgba(255,178,30,.25),transparent 55%),var(--ink);position:relative;overflow:hidden;color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 22px 74px;border-radius:0 0 30px 30px}
.mon{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:18px}
.mon button{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);color:#fff;font-size:18px}
.hero small{opacity:.7;font-size:13px}.big{font-size:38px;font-weight:800;letter-spacing:-1px;color:var(--gold)}
.card{background:var(--cd);border-radius:18px;padding:14px 16px;margin:0 16px 14px}
.up{margin-top:-46px;box-shadow:0 10px 30px rgba(18,33,63,.12)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.row3 small{color:var(--mu);font-size:12px;display:block}.row3 b{font-size:15px}
.in{color:var(--ok)}.out{color:var(--no)}
.ws{display:flex;gap:10px;overflow-x:auto;padding:0 16px 14px}
.w{flex:0 0 auto;min-width:140px;background:var(--cd);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center}.w .wi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:#fff4d9}
.w small{color:var(--mu);font-size:12px}.w b{display:block;font-size:17px}
h3{font-size:15px;margin:6px 20px 10px}
.day{display:flex;justify-content:space-between;margin:14px 22px 6px;font-size:13px;color:var(--mu);font-weight:600}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--bg)}
.it>div:nth-child(2){flex:1;min-width:0}.it b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{color:var(--mu);font-size:12px}.it span{font-weight:700;font-size:14px}
.x{color:#a9b2c6;font-size:15px;padding:6px 4px;min-width:34px}
.bar{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--gold);border-radius:8px}
.empty{text-align:center;color:var(--mu);padding:26px 10px;font-size:14px}
nav{position:fixed;bottom:calc(var(--bo) + env(safe-area-inset-bottom));left:12px;right:12px;max-width:456px;margin:auto;background:var(--cd);display:flex;padding:8px 0;border-radius:22px;box-shadow:0 8px 28px rgba(18,33,63,.18);z-index:4}
nav button{flex:1;font-size:11px;color:var(--mu);font-weight:600}nav button b{display:block;font-size:20px}nav button.on{color:var(--tx)}nav button.on b{filter:none}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(var(--bo) + 78px + env(safe-area-inset-bottom));height:58px;padding:0 22px;border-radius:29px;font-weight:700;font-size:16px;color:var(--ink);background:var(--gold);box-shadow:0 10px 24px rgba(255,178,30,.5);z-index:5}
/* Bảng nhập */
.ov{position:fixed;inset:0;background:rgba(18,33,63,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--cd);width:100%;max-width:480px;max-height:95vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:600;font-size:14px;color:var(--mu)}.seg button.on{background:var(--ink);color:#fff}
.amt{text-align:center;font-size:42px;font-weight:800;letter-spacing:-1px;margin:2px 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:20px;background:var(--bg);font-size:13px;font-weight:600;white-space:nowrap}.chip.on{background:var(--gold)}
.chip.t{border:1.5px dashed var(--gold);background:var(--cd)}
.lb{font-size:12px;color:var(--mu);font-weight:600;margin:6px 0}
.f{display:flex;gap:8px;margin:8px 0}.f input{flex:1;min-width:0;padding:12px;border:1.5px solid var(--line);border-radius:14px;font:inherit;font-size:15px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.kp button{padding:13px;border-radius:14px;background:var(--bg);font-size:20px;font-weight:600}.kp button:active{background:var(--gold)}
.save{width:100%;padding:15px;border-radius:16px;color:#fff;font-weight:700;font-size:16px;background:var(--ink)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ld i{animation:pl .7s infinite alternate}.ld i:nth-child(2){animation-delay:.12s}.ld i:nth-child(3){animation-delay:.24s}.ld i:nth-child(4){animation-delay:.36s}@keyframes pl{from{opacity:1;transform:translateY(0)}to{opacity:.3;transform:translateY(-6px)}}
.fg{margin-top:24px;font-size:13px;opacity:.7;text-decoration:underline;color:#fff}
.sy{font-size:12px;color:var(--gold);min-height:16px;margin-top:4px}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
#view.an>*{animation:fi .35s both}
.hi{font-size:13px;opacity:.8;margin-bottom:10px;position:relative;z-index:1}.hero::after{content:'🐱';position:absolute;right:-6px;top:56px;font-size:110px;opacity:.08;pointer-events:none}
.mon,.hero small,.big,.sy{position:relative;z-index:1}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.ch small{color:var(--mu);font-size:12px}
.sp{display:flex;align-items:flex-end;gap:2px;height:64px}.sp i{flex:1;background:#d9dfee;border-radius:3px 3px 0 0;min-height:3px}.sp i.t{background:var(--gold)}
.spl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:4px}
.dn{display:grid;place-items:center;margin-bottom:12px}.dn svg{width:170px}
.lg{display:flex;justify-content:space-between;font-size:14px}.lg b{display:flex;align-items:center;gap:6px}.lg b i{width:10px;height:10px;border-radius:50%;display:inline-block}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:14px;background:var(--bg);font-size:12px;font-weight:600;border:2px solid transparent}.tile span{font-size:22px}.tile.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff)}
.amt.Chi{color:var(--no)}.amt.Thu{color:var(--ok)}
.hint{font-size:13px;color:var(--mu);line-height:1.5}.rc{font-size:30px;font-weight:800;letter-spacing:2px;text-align:center;background:var(--bg);border-radius:16px;padding:18px;margin:14px 0;user-select:all}
.lnk{display:block;width:100%;padding:12px;color:var(--mu);font-size:13px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chip.on{color:#12213f}input{background:var(--cd);color:var(--tx)}.it{cursor:pointer}
.tile.on{background:color-mix(in srgb,var(--c) 14%,var(--cd))}
[data-th=dark] .save,[data-th=dark] .seg button.on{background:var(--gold);color:#12213f}
.dn circle:first-child{stroke:var(--bg)}.dn text{fill:var(--tx)}
.tg{position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 8px);z-index:2;font-size:17px;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25)}
.card.nd{background:#fff4d9;color:#7a5200;font-size:14px;font-weight:600;cursor:pointer}
.srch{padding:14px 16px 10px}.srch input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;font:inherit}
.yr{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end}.yb{height:90px;display:flex;align-items:flex-end;gap:1px}.yb i{flex:1;border-radius:2px 2px 0 0;min-height:2px}
.yr small{display:block;text-align:center;font-size:9px;color:var(--mu);margin-top:3px}.yr .cur small{color:var(--tx);font-weight:800}

/* ===== v2 · Ngân hàng hiện đại ===== */
.si{display:inline-block;vertical-align:middle;flex:none}
.hero{padding:calc(env(safe-area-inset-top) + 14px) 18px 84px;background:linear-gradient(180deg,#0b172e,#12213f)}
.hero::after{content:none}
.hi{display:flex;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:600;min-height:34px}
.tg{display:grid;place-items:center;color:#fff}
.mon{margin:6px 0 14px}.mon button{display:grid;place-items:center;color:#fff}.mon span{font-size:14px;font-weight:700}
.bc{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;color:#fff;background:linear-gradient(135deg,#27407a,#16294f 55%,#0f1d3a);border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.bc::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-110px;background:radial-gradient(circle,rgba(255,178,30,.5),transparent 65%)}
.bc::after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;left:-150px;bottom:-200px;border:1px solid rgba(255,255,255,.1);box-shadow:0 0 0 34px rgba(255,255,255,.03),0 0 0 68px rgba(255,255,255,.02)}
.bc>*{position:relative;z-index:1}
.bt{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.bc small{font-size:12px;opacity:.7;letter-spacing:.04em}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;color:#fff;font-variant-numeric:tabular-nums;margin-top:2px}
.bn{display:flex;justify-content:space-between;margin-top:16px;font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--gold)}
.card{border-radius:20px;border:1px solid var(--line)}
.up{margin-top:-54px;box-shadow:0 12px 32px rgba(18,33,63,.12)}
h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:22px 22px 10px}
.row3 small{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}.row3 b{font-size:16px;font-variant-numeric:tabular-nums}
.row3>div+div{border-left:1px solid var(--line)}
.w{border:1px solid var(--line);border-radius:20px}.w .wi{background:rgba(255,178,30,.16);color:#b77900}.w b{font-variant-numeric:tabular-nums}
.it{padding:12px 0}.ic{width:40px;height:40px;border-radius:12px}.it span{font-variant-numeric:tabular-nums;font-size:15px}
.x{color:var(--mu);display:grid;place-items:center}
nav{border:1px solid var(--line);border-radius:24px;padding:6px;gap:4px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;font-size:11px}
nav button b{display:grid;place-items:center}nav button.on{background:var(--ink);color:var(--gold)}
.fab{display:flex;align-items:center;gap:8px;box-shadow:0 12px 28px rgba(255,178,30,.4)}
.sh{padding-top:24px}.sh::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-12px auto 14px}
.amt{font-variant-numeric:tabular-nums;font-size:44px}
.chip{display:inline-flex;align-items:center;gap:6px}
.tile span{color:var(--c);display:block;font-size:0}.tile .si{width:24px;height:24px}
.seg button{display:flex;justify-content:center;align-items:center;gap:6px}
.empty{padding:34px 10px}.empty img{display:block;margin:0 auto 12px;width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
.card.nd{display:flex;gap:10px;align-items:center;border-color:#f3d48a}
.dt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.up{position:relative;z-index:2}
.bt{margin-bottom:14px}.big{font-size:32px}.bn{margin-top:12px}
.hero{padding-bottom:78px}.up{margin-top:-48px}
.seg button{white-space:nowrap;font-size:13px;gap:5px}
.sb{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu);padding:2px 0 2px 22px}
.cg{grid-template-columns:repeat(3,1fr)}.tile{padding:8px 4px}
.sk{height:92px;background:linear-gradient(90deg,var(--cd) 25%,var(--bg) 50%,var(--cd) 75%);background-size:200% 100%;animation:shm 1.2s linear infinite}@keyframes shm{to{background-position:-200% 0}}
.sk:first-child{margin-top:16px}

.lk{right:60px}.day b{font-weight:700}
.nw{text-align:center;padding:18px 16px}.nw small{color:var(--mu);font-size:11px;letter-spacing:.1em;font-weight:700}
.nw .tt{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0 12px}
.stk{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--bg)}.stk i{display:block;height:100%}
.nwl{display:flex;justify-content:space-between;gap:6px;margin-top:12px;text-align:left}.nwl span{display:flex;flex-direction:column;gap:2px;min-width:0}
.nwl em{font-style:normal;font-size:11px;font-weight:600}.nwl b{font-size:12.5px;font-variant-numeric:tabular-nums}
.gl{cursor:pointer}.gh{display:flex;align-items:center;gap:12px;margin-bottom:10px}.gh>div{flex:1;min-width:0}.gh b{display:block;font-size:15px}.gh small{color:var(--mu);font-size:12px}
.gi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,178,30,.16);color:#b77900}
.gp{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.gf{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}.gf span:last-child{color:var(--mu)}
.gt{font-size:12px;color:var(--mu);margin:6px 0 2px}.gl .chip{margin-top:10px}
.add{display:block;width:calc(100% - 32px);margin:0 16px 14px;padding:13px;border:1.5px dashed var(--line);border-radius:16px;color:var(--mu);font-weight:600;font-size:14px}

/* ===== v3 · Premium ===== */
body{background:radial-gradient(1100px 480px at 50% -8%,rgba(255,178,30,.10),transparent 60%),var(--bg);background-attachment:fixed}
button{transition:transform .16s cubic-bezier(.3,.7,.4,1),background .2s,opacity .2s}button:active{transform:scale(.96)}
.card{border-radius:22px;box-shadow:0 1px 2px rgba(18,33,63,.04),0 10px 30px rgba(18,33,63,.07);border-color:rgba(120,135,170,.18)}

.bc{background:linear-gradient(135deg,#2c4a8f 0,#18305f 48%,#0e1b38 100%);box-shadow:0 22px 50px rgba(5,12,30,.5),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.25);border-color:rgba(255,255,255,.18)}
.bc::before{background:radial-gradient(circle,rgba(255,196,64,.6),transparent 62%)}
.big{text-shadow:0 2px 14px rgba(255,178,30,.25)}
.up{box-shadow:0 18px 44px rgba(18,33,63,.16)}
nav{background:color-mix(in srgb,var(--cd) 78%,transparent);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:0 14px 40px rgba(18,33,63,.2)}

.fab{background:linear-gradient(135deg,#ffd166,#ffab00);box-shadow:0 14px 32px rgba(255,171,0,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.ov{background:rgba(8,16,38,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fo .2s}@keyframes fo{from{opacity:0}}
.sh{border-radius:30px 30px 0 0;animation:up .38s cubic-bezier(.2,.9,.25,1.05)}
.save{background:linear-gradient(135deg,#1c2f58,#12213f);box-shadow:0 10px 24px rgba(18,33,63,.28)}
[data-th=dark] .save{background:linear-gradient(135deg,#ffd166,#ffab00)}
.chip.on{background:linear-gradient(135deg,#ffd166,#ffb21e);box-shadow:0 4px 12px rgba(255,178,30,.3)}
.tile.on{box-shadow:0 6px 16px color-mix(in srgb,var(--c) 28%,transparent)}
.gdh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}.gdh b{display:block;font-size:15px}.gdh small{color:var(--mu);font-size:11.5px}
.gr{display:flex;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}.gr span{flex:1;font-weight:600}.gr b{font-variant-numeric:tabular-nums;font-size:17px}
.gr i{font-style:normal;font-size:11.5px;font-weight:700;min-width:72px;text-align:right}
.gu{font-size:11.5px;color:var(--mu);margin-top:4px}.gu.warn{color:#d97706}
.it .dl{display:block;font-size:11px;font-weight:700;text-align:right}.it .dl.in{color:var(--ok)}.it .dl.out{color:var(--no)}
.gr span small{display:block;font-weight:500;color:var(--mu);font-size:11.5px;margin-top:1px}
</style></head><body>

<div id="login">
  <div class="logo"><img src="icon-192.png" alt="Mèo"></div>
  <h1>Sổ Mèo</h1>
  <div id="lm">Đang kết nối…</div>
  <div class="dots" id="dots"><i>🐾</i><i>🐾</i><i>🐾</i><i>🐾</i></div>
  <div class="pad" id="pad"></div><button class="fg hide" id="fg" onclick="forgot()">Quên PIN?</button>
</div>

<div id="app" class="hide">
  <div class="hero">
    <div class="hi" id="hi"></div><button class="tg" onclick="theme()" aria-label="Đổi giao diện sáng/tối" data-i="moon" data-s="18"></button><button class="tg lk" onclick="lock()" aria-label="Khóa sổ" data-i="lock" data-s="18"></button>
    <div class="mon"><button onclick="mv(-1)" aria-label="Tháng trước" data-i="chL" data-s="18"></button><span id="mt"></span><button onclick="mv(1)" aria-label="Tháng sau" data-i="chR" data-s="18"></button></div>

function goalS(id){const name=$('gn').value.trim(),target=Math.round(+$('gt').value||0);if(!name||target<=0)return toast('Nhập tên và số tiền cần');

let syncing=false;
async function sync(force){
  if(!S.tk||syncing)return;
  const q=getQ();
  if(!q.length&&!force&&Date.now()-(S.lt||0)<60000)return;
  syncing=true;let again=false;
  try{
    if(q.length){
      const r=await call('api',S.tk,'addm',{items:q});
      if(r.err==='AUTH'){syncing=false;return lock(true)}
      if(r.err)throw 0;
      const done=new Set(r.ids||[]),bad=new Set((r.bad||[]).map(b=>b.id));
      (r.bad||[]).forEach(b=>toast('Bỏ qua 1 khoản lỗi: '+b.err));
      q.filter(x=>done.has(x.id)).forEach(fold);
      setQ(getQ().filter(x=>!done.has(x.id)&&!bad.has(x.id)));
      S.lt=Date.now();persist();render();again=true;
    }else{
      const r=await call('api',S.tk,'load',{month:S.month});
      if(r.err==='AUTH'){syncing=false;return lock(true)}
      if(r.month===S.month)apply(r);else cstore(r);
    }
  }catch(e){render();if(navigator.onLine&&getQ().length)setTimeout(sync,15000)}

    h=`<div class="srch"><input id="sq" type="search" placeholder="Tìm theo diễn giải, mục, ví…" value="${esc(S.q)}" oninput="S.q=this.value;histList()"></div><div class="chips" style="padding:0 16px">${[['all','Tất cả'],['Chi','Chi'],['Thu','Thu'],['Chuyển','Chuyển ví']].map(([k,l])=>`<button class="chip ${S.f===k?'on':''}" onclick="S.f='${k}';S.g='';S.sg='';render()">${l}</button>`).join('')}</div>${catChips()}<div id="hl"></div>`;
  }else{
    const lst=raw=>{const m={},sub={};Object.entries(raw).forEach(([c,v])=>{const g=grp(c);m[g]=(m[g]||0)+v;(sub[g]=sub[g]||{})[c]=v});
      const e=Object.entries(m).sort((a,b)=>b[1]-a[1]),tot=e.reduce((s,x)=>s+x[1],0);
      if(!tot)return empty('Chưa có dữ liệu');
      return donut(e,tot)+e.map(([c,v])=>{const sb=Object.entries(sub[c]).sort((a,b)=>b[1]-a[1]),hs=sb.length>1||sb[0][0]!==c;
        return `<div class="lg"><b><i style="background:${CC[c]||'#94a3b8'}"></i>${IC[c]||''} ${esc(c)}</b><span>${fmt(v)} · ${Math.round(v/tot*100)}%</span></div><div class="bar" style="margin-bottom:${hs?4:14}px"><i style="width:${v/tot*100}%;background:${CC[c]||'#94a3b8'}"></i></div>${hs?sb.map(([x,y])=>`<div class="sb"><span>${x===c?'Chung':esc(x)}</span><span>${fmt(y)}</span></div>`).join('')+'<div style="height:10px"></div>':''}`}).join('')};
    const by=k=>{const m={};T.filter(t=>t.k===k).forEach(t=>m[t.c]=(m[t.c]||0)+t.a);return lst(m)};
    const tg=`<div class="seg" style="margin:14px 16px 0">${[['m','Tháng'],['y','Năm']].map(([k,l])=>`<button class="${S.sv===k?'on':''}" onclick="setSV('${k}')">${l}</button>`).join('')}</div>`;
    if(S.sv==='y'){const Y=S.yr;
      if(!Y)h=tg+empty('Đang tải báo cáo năm…');
      else{const mi=+S.month.slice(5)-1,mx=Math.max(...Y.m.flatMap(x=>[x.t,x.c]),1),tt=Y.m.reduce((s,x)=>s+x.t,0),tc=Y.m.reduce((s,x)=>s+x.c,0),cur=Y.m[mi].c,prev=mi?Y.m[mi-1].c:0,dl=prev?Math.round((cur-prev)/prev*100):null;
        h=tg+`<div class="card" style="margin-top:14px"><div class="row3"><div><small>Thu năm ${Y.y}</small><b class="in">${fmt(tt)}</b></div><div><small>Chi năm</small><b class="out">${fmt(tc)}</b></div><div><small>Còn lại</small><b>${fmt(tt-tc)}</b></div></div></div>
        <h3>So sánh các tháng</h3><div class="card"><div class="yr">${Y.m.map((x,i)=>`<div class="${i===mi?'cur':''}"><div class="yb"><i style="height:${x.t/mx*100}%;background:var(--ok)"></i><i style="height:${x.c/mx*100}%;background:var(--no)"></i></div><small>T${i+1}</small></div>`).join('')}</div><div class="spl"><span><i class="dt" style="background:var(--ok)"></i>Thu</span><span><i class="dt" style="background:var(--no)"></i>Chi</span></div><p class="hint" style="margin-top:10px">${dl===null?'Chưa có dữ liệu tháng trước để so sánh.':`Chi tháng ${mi+1}: <b>${fmt(cur)}</b>, ${dl>=0?'tăng':'giảm'} <b class="${dl>=0?'out':'in'}">${Math.abs(dl)}%</b> so với tháng ${mi}.`}</p></div>
        <h3>Chi theo mục đích cả năm</h3><div class="card">${lst(Y.cat)}</div>`}
    }else h=tg+`<h3 style="margin-top:14px">Chi theo mục đích</h3><div class="card">${by('Chi')}</div><h3>Ngân sách tháng</h3><div class="card">${bl}</div><h3>Thu theo nguồn</h3><div class="card">${by('Thu')}</div>`;
  }
  if(S.loading)h='<div class="card sk"></div><div class="card sk"></div><div class="card sk"></div>';
  $('view').innerHTML=h;if(S.tab==='hist'&&!S.loading)histList();
}
function del(id,el){
  if(!el.dataset.s){el.dataset.s=1;el.textContent='Xóa?';el.style.color='var(--no)';setTimeout(()=>{if(el.isConnected){el.textContent='✕';el.style.color='';delete el.dataset.s}},3000);return}
  if(getQ().some(q=>q.id===id)){setQ(getQ().filter(q=>q.id!==id));render();return toast('Đã xóa')}
  const t=S.tx.find(x=>x.id===id);if(!t)return;
  unfold(t);render();persist();toast('Đã xóa');
  const back=m=>{fold(t);render();persist();toast(m)};
  call('api',S.tk,'del',{id,lean:1}).then(r=>{if(r.err){r.err==='AUTH'?lock(true):back(r.err)}}).catch(()=>back('Chưa xóa được, cần có mạng'));
}

/* ---- Bảng ghi chép ---- */
const pickG=i=>{E.c=defC(CAT[E.k][i],E.k);sheet()},pickS=i=>{E.c=TREE[E.k][grp(E.c)][i];sheet()};
function openE(){E={k:'Chi',a:'',c:defC('Ăn uống'),w:S.w[0].n,w2:(S.w[1]||S.w[0]).n,d:today(),n:''};sheet()}
function setK(k){E.k=k;E.c=CAT[k]?defC(CAT[k][0],k):'';if(k==='Chuyển'&&E.w===E.w2){const o=S.w.find(w=>w.n!==E.w);if(o)E.w2=o.n}sheet()}
function sheet(){
  const tp=S.tpl.filter(t=>t.k===E.k);
  const wc=sel=>S.w.map((w,i)=>`<button class="chip ${w.n===E[sel]?'on':''}" onclick="E.${sel}=S.w[${i}].n;sheet()">${wi(w.n)} ${esc(w.n)}</button>`).join('');
  $('m').innerHTML=`<div class="ov" onclick="if(event.target===this)closeE()"><div class="sh">
  <div class="seg">${[['Chi','Chi ra',ic('out',16)],['Thu','Thu vào',ic('in',16)],['Chuyển','Chuyển ví',ic('swap',16)]].map(([k,l,i])=>`<button class="${E.k===k?'on':''}" onclick="setK('${k}')">${i} ${l}</button>`).join('')}</div>
  <div class="amt ${E.k}" id="amt">${E.a?nf(+E.a):'0'}đ</div>
  ${tp.length?`<div class="chips">${tp.map((t,i)=>`<button class="chip t" onclick="useT(${i})">${IC[t.c]||''} ${esc(t.n)} · ${nf(t.a)}</button>`).join('')}</div>`:''}
  <div class="kp">${['1','2','3','4','5','6','7','8','9','000','0','⌫'].map(k=>`<button onclick="kp('${k}')">${k}</button>`).join('')}</div>
  ${E.k==='Chuyển'?'':`<div class="lb">Mục</div><div class="cg">${CAT[E.k].map((g,i)=>`<button class="tile ${g===grp(E.c)?'on':''}" style="--c:${CC[g]}" onclick="pickG(${i})"><span>${IC[g]}</span>${g}</button>`).join('')}</div>${((TREE[E.k]||{})[grp(E.c)]||[]).length?`<div class="lb">Chi tiết</div><div class="chips">${TREE[E.k][grp(E.c)].map((c,i)=>`<button class="chip ${c===E.c?'on':''}" onclick="pickS(${i})">${c}</button>`).join('')}</div>`:''}`}
  <div class="lb">${E.k==='Chuyển'?'Từ ví':'Ví'}</div><div class="chips">${wc('w')}</div>
  ${E.k==='Chuyển'?`<div class="lb">Đến ví</div><div class="chips">${wc('w2')}</div>`:''}
  <div class="f"><input type="date" value="${E.d}" oninput="E.d=this.value" aria-label="Ngày"><input id="nt" placeholder="Diễn giải (không bắt buộc)" maxlength="120" value="${esc(E.n)}" oninput="E.n=this.value"></div>
  <button class="save" id="sv" onclick="save()">${E.edit?'Cập nhật giao dịch':'Lưu giao dịch'}</button></div></div>`;
}
const modal=x=>$('m').innerHTML=`<div class="ov"><div class="sh">${x}</div></div>`;
function forgot(){modal(`<h3 style="margin:4px 0 6px">Khôi phục PIN</h3><p class="hint">Nhập mã khôi phục 10 ký tự bạn đã lưu khi tạo PIN.</p><div class="f"><input id="rc" placeholder="XXXXX-XXXXX" autocapitalize="characters" autocomplete="off"></div><button class="save" onclick="goRec()">Tiếp tục</button><button class="lnk" onclick="closeE()">Hủy</button><p class="hint">Mất mã? Mở Apps Script, chạy hàm <b>resetPin</b>, rồi bấm nút dưới đây để tạo PIN mới.</p><button class="lnk" onclick="closeE();lock(true)">Tôi đã chạy resetPin</button>`)}
function goRec(){const c=$('rc').value.trim();if(c.replace(/[^A-Za-z0-9]/g,'').length<10)return toast('Mã gồm 10 ký tự');RC=c;closeE();mode='new';first=null;pin='';dots();$('lm').textContent='Tạo PIN mới (4 số)';$('fg').classList.add('hide')}
function showRec(c){modal(`<h3 style="margin:4px 0 6px">Mã khôi phục PIN</h3><p class="hint">Chép mã này vào nơi an toàn (ghi chú, giấy). Mã chỉ hiện <b>một lần</b>, dùng khi bạn quên PIN.</p><div class="rc">${c.slice(0,5)}-${c.slice(5)}</div><button class="save" onclick="closeE()">Đã chép lại</button>`)}
function chkRec(){if(S.tk&&S.hasRec===false&&!recAsked&&$('m').innerHTML===''&&!$('app').classList.contains('hide')){recAsked=true;modal(`<h3 style="margin:4px 0 6px">Tạo mã khôi phục PIN</h3><p class="hint">Sổ của bạn chưa có mã khôi phục. Tạo ngay để lỡ quên PIN vẫn lấy lại được.</p><button class="save" onclick="mkRec()">Tạo mã khôi phục</button><button class="lnk" onclick="closeE()">Để sau</button>`)}}
async function mkRec(){try{const r=await call('api',S.tk,'rec',{month:S.month});if(r.err)return toast(r.err);apply(r);if(r.newRec)showRec(r.newRec);else closeE()}catch(e){toast('Cần có mạng để tạo mã')}}
function closeE(){$('m').innerHTML=''}
function kp(k){E.a=k==='⌫'?E.a.slice(0,-1):(E.a+k).replace(/^0+/,'').slice(0,12);$('amt').textContent=(E.a?nf(+E.a):'0')+'đ'}
function useT(i){const t=S.tpl.filter(t=>t.k===E.k)[i];Object.assign(E,{n:t.n,a:String(t.a),c:t.c,w:t.w});sheet()}
async function save(){
  if(!(+E.a>0))return toast('Nhập số tiền trước nhé');
  if(!E.d)return toast('Chọn ngày');
  if(E.k==='Chuyển'&&E.w===E.w2)return toast('Chọn 2 ví khác nhau');
  const ch=E.k==='Chuyển';
  if(E.edit){const o={id:E.edit,k:E.k,a:+E.a,c:ch?'':E.c,w:E.w,w2:ch?E.w2:'',d:E.d,n:E.n},q=getQ(),qi=q.findIndex(x=>x.id===E.edit);
    if(qi>=0){q[qi]=o;setQ(q);closeE();render();return toast('Đã cập nhật')}
    const old=S.tx.find(x=>x.id===E.edit);if(!old)return toast('Không tìm thấy giao dịch');
    unfold(old);fold(o);closeE();render();persist();toast('Đã cập nhật');
    const undo=m=>{unfold(o);fold(old);render();persist();toast(m)};
    call('api',S.tk,'upd',{...o,lean:1}).then(r=>{if(r.err){r.err==='AUTH'?lock(true):undo(r.err)}}).catch(()=>undo('Chưa cập nhật được, cần có mạng'));
    return}
  setQ([...getQ(),{id:uid(),k:E.k,a:+E.a,c:ch?'':E.c,w:E.w,w2:ch?E.w2:'',d:E.d,n:E.n}]);
  closeE();render();
  toast(navigator.onLine?'Đã lưu, đang đồng bộ…':'Đã lưu trên máy, có mạng sẽ tự đồng bộ');sync();
}

/* ---- Khởi động ---- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('online',sync);window.addEventListener('offline',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){sync();if(S.tab==='ast'&&S.tk&&(!S.gold||Date.now()-(S.gold.at||0)>90000))goldR(true)}});
setInterval(()=>{if(S.tk&&S.tab==='ast'&&!document.hidden&&navigator.onLine)goldR(true)},75000);
(async()=>{
  pad();S.tk=store.get('tk');
  if(!API){API=(prompt('Dán link ứng dụng (đuôi /exec) lấy từ Apps Script:')||'').trim();if(API)store.set('api',API)}
  let c={};try{c=JSON.parse(store.get('c')||'{}')}catch(e){}
  const any=Object.values(c)[0],last=c[S.month]||(any&&{...any,tx:[],month:S.month});
  if(S.tk&&last){apply(last);if(store.get('lk')&&store.get('ph')){lock();return}showApp();sync(true);return}
  if(S.tk){try{await enter();return}catch(e){}}
  init();
})();
</script></body></html>
